server {
    listen 80;
    listen [::]:80;
    server_name anp-demo.awiki.info;
    return 308 https://anp-demo.awiki.info$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name anp-demo.awiki.info;
    ssl_certificate /etc/nginx/ssl/awiki.info.pem;
    ssl_certificate_key /etc/nginx/ssl/awiki.info.key;
    client_max_body_size 16k;

    location = /.well-known/oauth-protected-resource {
        return 404;
    }

    # Public verification material for task-owned live test client identities.
    location ^~ /test-identities/ {
        root /var/lib/awiki-anp-demo/public;
        try_files $uri =404;
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass http://127.0.0.1:21696;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_buffering off;
    }
}
